<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Game Room</title>
<meta name="theme-color" content="#160e09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:38rem;margin:0 auto;padding-left:1.5rem;padding-right:1.5rem}
section.game{scroll-margin-top:3.5rem}
p{margin:0 0 1rem}
ol,ul{margin:0 0 1rem;padding-left:1.25rem}
li{margin:.4rem 0}
dl{margin:0}
dd{margin:0}
.roles>div{display:grid;grid-template-columns:1fr auto;gap:.15rem 1rem;align-items:baseline}
.roles>div>dd:last-child{grid-column:1/-1}
.sw{display:inline-block;width:.6rem;height:.6rem;margin-right:.55rem;vertical-align:.08em}
.win,.rules{list-style:none;padding:0}
.switch{position:sticky;top:0;z-index:5}
.switch .in{display:flex;max-width:38rem;margin:0 auto;padding:0 1.5rem}
.switch a{flex:1;text-align:center;text-decoration:none}
.timer{display:grid;grid-template-columns:repeat(3,1fr);margin:0 0 1.25rem}
.timer b,.timer span{display:block}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important}}

:root{--bg:#160e09;--bg2:#21160e;--candle:#e9b45a;--candle-hi:#ffd98f;--text:#efe4d2;--dim:#a8998a;--line:rgba(233,180,90,.22);--red:#c43b2f;--blue:#3f7cc2}
body{background:var(--bg);color:var(--text);font:400 1rem/1.65 "IBM Plex Sans",system-ui,sans-serif}
:focus-visible{outline:2px solid var(--candle-hi);outline-offset:3px}
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:3rem;overflow:hidden}
.hero::before{content:"";position:absolute;left:-30%;bottom:-25%;width:130%;height:85%;
  background:radial-gradient(ellipse at 30% 70%, rgba(233,180,90,.38), rgba(233,120,40,.12) 35%, transparent 65%);animation:breathe 5s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
.hero>*{position:relative}
.kicker{font:italic 500 1.15rem "Bodoni Moda",serif;color:var(--candle);margin:0 0 1rem}
h1{font:700 clamp(4rem,21vw,6.5rem)/.86 "Bodoni Moda",serif;margin:0 0 1.5rem;letter-spacing:-.02em;color:var(--text)}
h1 span{display:block}
.hero .sub{color:var(--dim);max-width:22rem;margin-bottom:2.5rem}
.picker{border-top:1px solid var(--line)}
.picker a{display:flex;flex-direction:column;gap:.4rem;padding:1.1rem 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}
.picker strong{font:500 1.7rem/1.05 "Bodoni Moda",serif;white-space:nowrap}
.picker span{color:var(--dim);font-size:.92rem}
.picker a:hover strong{color:var(--candle-hi)}
.switch{background:rgba(22,14,9,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.switch .in{gap:2rem;justify-content:flex-start}
.switch a{flex:0 0 auto;color:var(--dim);padding:.85rem 0;font-weight:500;font-size:.95rem;border-bottom:2px solid transparent}
.switch a.on{color:var(--candle-hi);border-bottom-color:var(--candle)}
section.game{padding-top:4rem;padding-bottom:1rem}
section.game+section.game{border-top:1px solid var(--line);margin-top:2rem}
h2{font:700 3.6rem/.9 "Bodoni Moda",serif;margin:0 0 1.25rem;letter-spacing:-.02em}
.lead{font:italic 500 1.3rem/1.45 "Bodoni Moda",serif;color:var(--candle);margin-bottom:2.5rem}
h3{font:600 .95rem/1.3 "IBM Plex Sans",sans-serif;color:var(--candle);margin:2.5rem 0 .75rem;padding-top:.75rem;border-top:1px solid var(--line)}
h4{font:italic 500 1.5rem/1.1 "Bodoni Moda",serif;margin:0 0 .5rem;color:var(--candle-hi)}
.note{color:var(--dim)}
.roles>div{padding:.8rem 0}
.roles>div+div{border-top:1px solid rgba(239,228,210,.08)}
.roles dt{font:500 1.35rem/1.2 "Bodoni Moda",serif}
.roles .n{color:var(--candle);font-size:.85rem}
.roles dd:last-child{color:var(--dim)}
.sw{border-radius:50%}.sw.red{background:var(--red)}.sw.blue{background:var(--blue)}
.phases{display:grid;gap:1.75rem;margin:0 0 1.25rem}
.phase{padding-left:1.1rem;border-left:1px solid var(--candle)}
ol li::marker{color:var(--candle);font-weight:600}
.win li{font-size:1.05rem;padding:.4rem 0}
.win b{font:italic 500 1.25rem "Bodoni Moda",serif;color:var(--candle-hi);margin-right:.25rem}
.win .m b,.win .r b{color:#e46a5c}.win .b b{color:#79a9e3}
.steps b,.rules b{color:var(--text);font-weight:600}
.rules li{padding:.35rem 0 .35rem 1.5rem;position:relative}
.rules li::before{content:"";position:absolute;left:0;top:1.05em;width:.8rem;height:1px;background:var(--candle)}
.timer{gap:1px;background:var(--line);border:1px solid var(--line)}
.timer div{background:var(--bg);padding:1rem .5rem}
.timer b{font:700 2rem/1 "Bodoni Moda",serif;color:var(--candle-hi)}
.timer span{color:var(--dim);font-size:.85rem;margin-top:.35rem}
footer{padding:4rem 1.5rem 4.5rem;max-width:38rem;margin:0 auto;font:italic 500 1.2rem "Bodoni Moda",serif;color:var(--dim)}

.view{display:none}
.view.active{display:block;animation:enter .35s ease-out}
.hero.view, #home.active .hero{display:flex}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
section.game{padding-top:1.25rem!important;margin-top:0!important;border-top:0!important}
.back{display:inline-flex;align-items:center;gap:.5rem;color:var(--dim);text-decoration:none;font-weight:500;font-size:.95rem;padding:.6rem 0;margin-bottom:2.25rem}
.back::before{content:"";width:.55rem;height:.55rem;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg)}
.back:hover{color:var(--candle-hi)}
.picker a strong::after{content:"";display:inline-block;width:.5rem;height:.5rem;margin-left:.6rem;border-right:1.5px solid var(--candle);border-top:1.5px solid var(--candle);transform:rotate(45deg);vertical-align:.3em}
.parity{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 1rem}
.parity div{background:var(--bg);padding:1rem}
.parity b{display:block;font:700 2rem/1 "Bodoni Moda",serif}
.parity .odd b{color:#e46a5c}.parity .even b{color:#79a9e3}
.parity span{color:var(--dim);font-size:.9rem}
.note b{color:var(--text);font-weight:600}
</style>
</head>
<body>
<header class="wrap hero">
  <p class="kicker">Shankhinee &amp; Anudeep</p>
  <h1><span>The</span><span>Game</span><span>Room</span></h1>
  <p class="sub">Every game night we host, and the games we play.</p>
  <nav class="picker" aria-label="Game nights">
    <a href="diwali-2026/"><strong>Diwali 2026</strong><span>Mafia, and Two Rooms and a Boom</span></a>
  </nav>
</header>
<footer>More nights coming.</footer>
</body>
</html>
